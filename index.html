<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Beth and Will's Shows</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7f9;color:#172033}header{background:#111827;color:#fff;padding:20px 18px 16px;position:sticky;top:0;z-index:3}header h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:#cbd5e1;font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px 14px 88px}.nav{display:flex;gap:7px;overflow:auto;padding:10px 0 16px}.nav button,.add{border:0;border-radius:999px;padding:9px 13px;background:#e5e7eb;white-space:nowrap;font-weight:650}.nav .on{background:#111827;color:#fff}.section{margin:4px 0 22px}.section h2{font-size:18px;margin:0 0 10px}.card{background:white;border-radius:15px;padding:14px;margin:9px 0;box-shadow:0 1px 4px #00000012;border-left:5px solid #94a3b8}.card.green{border-color:#22c55e}.card.blue{border-color:#3b82f6}.card.amber{border-color:#f59e0b}.card.purple{border-color:#8b5cf6}.top{display:flex;justify-content:space-between;gap:10px}.title{font-weight:750;font-size:17px}.provider{font-size:12px;color:#64748b}.badge{font-size:11px;font-weight:700;border-radius:999px;padding:5px 8px;height:max-content;background:#f1f5f9}.detail{font-size:13px;color:#475569;margin:8px 0}.watch{width:100%;border:0;border-radius:10px;padding:10px;background:#dcfce7;color:#166534;font-weight:750}.empty{color:#64748b;font-size:14px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:4}.bottom button{border:0;background:none;font-size:11px;color:#475569}.plus{position:fixed;right:18px;bottom:70px;width:52px;height:52px;border-radius:50%;border:0;background:#111827;color:#fff;font-size:27px;box-shadow:0 3px 12px #0003}
</style></head><body>
<header><h1>Beth and Will's Shows</h1><p>Your shows, progress and what's next</p></header>
<main class="wrap"><div class="nav"><button class="on">Home</button><button>My Shows</button><button>Updates</button><button>Discover</button><button>Archive</button></div><div id="app"></div></main>
<button class="plus" onclick="alert('Add Show search is coming next')">+</button>
<nav class="bottom"><button>⌂<br>Home</button><button>▣<br>My Shows</button><button>●<br>Updates</button><button>⌕<br>Discover</button><button>□<br>Archive</button></nav>
<script>
const shows=[
["Ted Lasso","Apple","Watching Now","Caught up — waiting for next episode","green"],
["House of the Dragon","HBO Max","Watching Now","Season 3 • Episode 1 watched","green"],
["Blood of My Blood","Starz","Watching Now","Season 2 • Episode 1 watched","green"],
["Furious","Hulu","Ready to Start","New show to us","blue"],
["A Knight of the Seven Kingdoms","HBO Max","Ready to Start","New show to us","blue"],
["MobLand","Paramount+","Ready to Start","New show to us","blue"],
["Yellowstone","Paramount+","Ready to Start","New show to us","blue"],
["1883","Paramount+","Ready to Start","New show to us","blue"],
["1923","Paramount+","Ready to Start","New show to us","blue"],
["Dutton Ranch","Paramount+","Ready to Start","New show to us","blue"],
["Marshals","Paramount+","Ready to Start","New show to us","blue"],
["Lioness","Paramount+","Waiting","Watched through Season 3","amber"],
["Yellowjackets","","Waiting","Watched through Season 3","amber"],
["The Testaments","Hulu","Waiting","Watched Season 1","amber"],
["Paradise","Hulu","Waiting","Watched through Season 2","amber"],
["The Pitt","HBO Max","Waiting","Watched through Season 2","amber"],
["Love is Blind","Netflix","Waiting","Caught up","amber"],
["Married at First Sight","Peacock","Waiting","Caught up","amber"],
["Silo","Apple","Waiting","Watched through Season 3","amber"],
["Love is Blind UK","Netflix","Upcoming","Latest season to watch","purple"],
["Power: Legacy","Starz","Upcoming","Waiting for release","purple"],
["Power: Origins","Starz","Upcoming","Waiting for release","purple"]
];
const groups=["Watching Now","Ready to Start","Waiting","Upcoming"];
document.getElementById("app").innerHTML=groups.map(g=>'<section class="section"><h2>'+g+'</h2>'+shows.filter(s=>s[2]===g).map(s=>'<article class="card '+s[4]+'"><div class="top"><div><div class="title">'+s[0]+'</div><div class="provider">'+(s[1]||'Provider to confirm')+'</div></div><span class="badge">'+g+'</span></div><div class="detail">'+s[3]+'</div>'+(g==="Watching Now"?'<button class="watch" onclick="this.textContent=\'✓ Progress saved\'">✓ Mark Next Episode Watched</button>':'')+'</article>').join('')+'</section>').join('');
</script></body></html>
