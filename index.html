<script>

const SUPABASE_URL=window.BW_CONFIG?.supabaseUrl||"",SUPABASE_KEY=window.BW_CONFIG?.supabaseKey||"";
let cloudToken=null,cloudTimer=null;
const seed=[

];
localStorage.removeItem("bwShows");localStorage.removeItem("bwShowIds");
let shows;try{shows=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){shows=structuredClone(seed)}
let page="Home",categoryFilter="All",lastChange=null;const tabs=["Home","My Shows","Updates","Discover","Archive"];
function color(s){return s==="Watching Now"?"green":s==="Waiting"?"amber":s==="Upcoming"?"purple":s==="Archive"?"gray":"blue"}
function save(){localStorage.setItem(KEY,JSON.stringify(shows));if(cloudToken){clearTimeout(cloudTimer);cloudTimer=setTimeout(syncAll,500)}}
function rowToShow(r){return {cloudId:r.id,title:r.title,stream:r.stream||"Checking U.S. availability",status:r.status,note:r.note||"",progress:r.season?(r.season_complete?{season:r.season,complete:true}:{season:r.season,episode:r.episode||0}):null,ids:{imdb:r.imdb_id||null,tvmaze:r.tvmaze_id?Number(r.tvmaze_id):null,tmdb:r.tmdb_id?Number(r.tmdb_id):null,thetvdb:r.tvdb_id?Number(r.tvdb_id):null},category:r.our_category||"Regular TV"}}
function showToRow(s){let p=s.progress||null;return {title:s.title,stream:s.stream,status:s.status,note:s.note,season:p?p.season:null,episode:p&&!p.complete?p.episode:null,season_complete:!!(p&&p.complete),imdb_id:s.ids&&s.ids.imdb||null,tvmaze_id:s.ids&&s.ids.tvmaze?String(s.ids.tvmaze):null,tmdb_id:s.ids&&s.ids.tmdb?String(s.ids.tmdb):null,tvdb_id:s.ids&&(s.ids.thetvdb||s.ids.tvdb)?String(s.ids.thetvdb||s.ids.tvdb):null,archived:s.status==="Archive",our_category:s.category||"Regular TV",updated_at:new Date().toISOString()}}
async function api(path,opt){opt=opt||{};let h={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+cloudToken,"Content-Type":"application/json"};Object.assign(h,opt.headers||{});let r=await fetch(SUPABASE_URL+"/rest/v1/"+path,Object.assign({},opt,{headers:h}));if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
function syncStatus(msg,ok){let el=document.getElementById("sync");if(el)el.innerHTML='<div class="syncbar '+(ok?"syncok":"")+'">'+msg+'</div>'}
async function syncAll(){if(!cloudToken)return;try{for(let s of shows){let row=showToRow(s);if(s.cloudId){await api("shows?id=eq."+s.cloudId,{method:"PATCH",body:JSON.stringify(row),headers:{"Prefer":"return=minimal"}})}else{let x=await api("shows",{method:"POST",body:JSON.stringify(row),headers:{"Prefer":"return=representation"}});if(x&&x[0])s.cloudId=x[0].id}}localStorage.setItem(KEY,JSON.stringify(shows));syncStatus("✓ Shared library synced",true)}catch(e){syncStatus("Cloud sync needs attention. Your local copy is safe.",false)}}
async function cloudStart(){if(!SUPABASE_URL||!SUPABASE_KEY){syncStatus("Cloud configuration is missing.",false);return}let hp=new URLSearchParams(location.hash.slice(1));if(hp.get("type")==="recovery"&&hp.get("access_token")){cloudToken=hp.get("access_token");showRecovery();return}let saved=localStorage.getItem("bwCloudSession");if(saved){try{let x=JSON.parse(saved);cloudToken=x.access_token||null}catch(e){}}if(!cloudToken){showLogin();return}try{await loadCloud()}catch(e){localStorage.removeItem("bwCloudSession");cloudToken=null;showLogin("Please sign in again.")}}
function showRecovery(msg){msg=msg||"Choose a new password for the B&W Shows account.";let el=document.getElementById("sync");if(!el)return;el.innerHTML='<div class="syncbar">'+msg+'<div class="loginbox"><input id="newCloudPass" type="password" autocomplete="new-password" placeholder="New password"><input id="newCloudPass2" type="password" autocomplete="new-password" placeholder="Confirm new password"><button onclick="setCloudPassword()">Set New Password</button></div></div>'}
async function setCloudPassword(){let a=document.getElementById("newCloudPass").value,b=document.getElementById("newCloudPass2").value;if(a.length<8)return showRecovery("Use a password of at least 8 characters.");if(a!==b)return showRecovery("The two passwords do not match. Try again.");syncStatus("Saving new password…",false);try{let r=await fetch(SUPABASE_URL+"/auth/v1/user",{method:"PUT",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+cloudToken,"Content-Type":"application/json"},body:JSON.stringify({password:a})});let x=await r.json();if(!r.ok)throw new Error(x.msg||x.message||x.error||"Password update failed");history.replaceState(null,"",location.pathname);syncStatus("✓ Password changed. Please sign in with your new password.",true);cloudToken=null;setTimeout(function(){showLogin("Password changed successfully. Sign in with your new password.")},1200)}catch(e){showRecovery("Could not change password: "+(e.message||"Unknown error"))}}
function showLogin(msg){msg=msg||"Connect this device to Beth & Will’s shared show library.";let el=document.getElementById("sync");if(!el)return;el.innerHTML='<div class="syncbar">'+msg+'<div class="loginbox"><input id="cloudEmail" type="email" autocomplete="username" placeholder="Email"><input id="cloudPass" type="password" autocomplete="current-password" placeholder="Password"><button onclick="cloudLogin()">Sign in to Shared Library</button></div></div>'}
async function cloudLogin(){let email=document.getElementById("cloudEmail").value.trim(),password=document.getElementById("cloudPass").value;if(!email||!password)return alert("Enter the email and password you created in Supabase.");syncStatus("Signing in…",false);try{let r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email,password:password})});let x=await r.json();if(!r.ok)throw new Error(x.error_description||x.msg||x.message||x.error||("Sign-in failed (HTTP "+r.status+")"));cloudToken=x.access_token;localStorage.setItem("bwCloudSession",JSON.stringify(x));await loadCloud()}catch(e){cloudToken=null;showLogin("Sign-in failed: "+(e.message||"Unknown authentication error"))}}
async function loadCloud(){syncStatus("Connecting to shared library…",false);let rows=await api("shows?select=*&order=id.asc");if(rows.length){shows=rows.map(rowToShow);localStorage.setItem(KEY,JSON.stringify(shows));render();syncStatus("✓ Shared library connected",true)}else{await syncAll();render();syncStatus("✓ Shared library created and connected",true)}}
function go(p){page=p;render();scrollTo(0,0)}
function setCategoryFilter(v){categoryFilter=v;page="Home";render()}
function toggleMore(){document.getElementById("moreMenu")?.classList.toggle("open")}
function filteredShows(){return shows.map((s,i)=>[s,i]).filter(x=>categoryFilter==="All"||(x[0].category||"Regular TV")===categoryFilter)}
async function resolveTvmaze(s){if(s.ids.tvmaze)return s.ids.tvmaze;if(!s.ids.imdb)return null;try{let r=await fetch("https://api.tvmaze.com/lookup/shows?imdb="+encodeURIComponent(s.ids.imdb));if(!r.ok)return null;let sh=await r.json();s.ids.tvmaze=sh.id;s.ids.imdb=(sh.externals&&sh.externals.imdb)||s.ids.imdb;s.ids.thetvdb=sh.externals&&sh.externals.thetvdb;save();return sh.id}catch(e){return null}}
async function autoLink(){for(const s of shows){if(s.ids.tvmaze||s.ids.imdb)continue;try{let r=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(s.title));if(!r.ok)continue;let a=await r.json(),n=v=>(v||"").toLowerCase().replace(/[^a-z0-9]/g,""),x=a.filter(z=>n(z.show.name)===n(s.title));if(x.length===1){let sh=x[0].show;s.ids={tvmaze:sh.id,imdb:sh.externals&&sh.externals.imdb||null,thetvdb:sh.externals&&sh.externals.thetvdb||null};save()}}catch(e){}}render()}
function advance(i){let s=shows[i];lastChange={i,progress:s.progress?{...s.progress}:null,note:s.note};if(!s.progress)s.progress={season:1,episode:1};else if(s.progress.complete){s.progress={season:s.progress.season+1,episode:1}}else s.progress.episode++;s.note="Season "+s.progress.season+" • Episode "+s.progress.episode+" watched";save();render()}
function undoProgress(){if(!lastChange)return;let s=shows[lastChange.i];s.progress=lastChange.progress;s.note=lastChange.note;lastChange=null;save();render()}
function editProgress(i){let s=shows[i],p=s.progress||{};let a=prompt("Season number",p.season||"");if(a===null)return;let b=prompt("Last episode watched",p.episode||"");if(b===null)return;a=parseInt(a);b=parseInt(b);if(!a||isNaN(b)||b<0)return alert("Please enter valid season and episode numbers.");s.progress={season:a,episode:b};s.note="Season "+a+" • Episode "+b+" watched";s.status="Watching Now";save();render()}
function archiveShow(i){shows[i].previousStatus=shows[i].status;shows[i].status="Archive";save();render()}
function restoreShow(i){shows[i].status=shows[i].previousStatus||"Ready to Start";save();render()}
function changeCategory(i){let s=shows[i],v=prompt("Our Category for "+s.title+"\n\n1. Regular TV\n2. Filler TV\n3. Trash TV",s.category==="Filler TV"?"2":s.category==="Trash TV"?"3":"1");let map={"1":"Regular TV","2":"Filler TV","3":"Trash TV"};if(!map[v])return;s.category=map[v];save();render()}
function changeStatus(i){let s=shows[i],v=prompt("Set status for "+s.title+"\n\n1. Watching Now\n2. Ready to Start\n3. Waiting\n4. Upcoming","1");let map={"1":"Watching Now","2":"Ready to Start","3":"Waiting","4":"Upcoming"};if(!map[v])return;s.status=map[v];save();render()}
async function addShow(){let t=prompt("Search for a show");if(!t)return;try{let r=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(t)),a=await r.json();if(!a.length)return alert("No matches found.");let list=a.slice(0,5),choices=list.map((x,n)=>(n+1)+". "+x.show.name+" ("+(x.show.premiered?x.show.premiered.slice(0,4):"year unknown")+")").join("\n");let pick=parseInt(prompt("Choose the exact show:\n\n"+choices+"\n\nEnter 1-"+list.length))-1;if(isNaN(pick)||pick<0||pick>=list.length)return;let sh=list[pick].show;if(shows.some(s=>s.ids.tvmaze===sh.id))return alert("That exact show is already in My Shows.");let mode=prompt("How should we add "+sh.name+"?\n\n1. Ready to Start\n2. Watching Now\n3. Already Watched / Caught Up\n\nEnter 1, 2 or 3","1");
if(mode===null)return;
let status="Ready to Start",note="New show to us",progress=null;
if(mode==="2"){
  let sn=parseInt(prompt("Current season","1")),ep=parseInt(prompt("Last episode watched","0"));
  if(!sn||isNaN(ep)||ep<0)return alert("Please enter valid season and episode numbers.");
  status="Watching Now";progress={season:sn,episode:ep};note=ep?"Season "+sn+" • Episode "+ep+" watched":"Starting Season "+sn;
}else if(mode==="3"){
  let sn=parseInt(prompt("Latest season you finished","1"));
  if(!sn)return alert("Please enter a valid season number.");
  status="Waiting";progress={season:sn,complete:true};note="Watched through Season "+sn;
}else if(mode!=="1")return alert("Please choose 1, 2 or 3.");
shows.push({title:sh.name,stream:"Checking U.S. availability",status,note,progress,category,ids:{tvmaze:sh.id,imdb:sh.externals&&sh.externals.imdb||null,thetvdb:sh.externals&&sh.externals.thetvdb||null}});save();page="My Shows";render();alert(sh.name+" was added to My Shows.")}catch(e){alert("Show search is temporarily unavailable.")}}
async function liveNext(s,i){if(!s.progress)return;let box=document.getElementById("live"+i);if(!box)return;try{let id=await resolveTvmaze(s);if(!id){box.textContent="Exact episode source not linked yet.";return}let r=await fetch("https://api.tvmaze.com/shows/"+id+"/episodes");if(!r.ok)throw 0;let eps=await r.json(),p=s.progress,now=new Date(),next=p.complete?eps.find(e=>e.season>p.season&&e.number!=null):eps.find(e=>e.season===p.season&&e.number===p.episode+1);let b=document.getElementById("watch"+i);if(!next){box.innerHTML='<span class="caught">✓ Caught Up</span><div class="statusline">No next episode is currently listed.</div>';if(b)b.style.display="none";return}let when=next.airstamp?new Date(next.airstamp):next.airdate?new Date(next.airdate+"T23:59:59"):null,released=when&&when<=now,title=next.name?" — "+next.name:"",d=when?when.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}):"date TBA";if(released){box.innerHTML='<span class="newEp">NEW EPISODE AVAILABLE</span><div class="statusline">S'+next.season+" E"+next.number+title+(when?" • "+d:"")+"</div>";if(!b&&s.status==="Waiting"){box.insertAdjacentHTML("afterend",'<button id="watch'+i+'" class="watch">✓ Mark S'+next.season+" E"+next.number+" Watched</button>");b=document.getElementById("watch"+i)}if(b){b.style.display="block";b.textContent="✓ Mark S"+next.season+" E"+next.number+" Watched";b.onclick=()=>markExact(i,next.season,next.number)}}else{box.innerHTML='<span class="scheduled">✓ Caught Up</span><div class="statusline">Next: S'+next.season+" E"+next.number+title+" • "+d+"</div>";if(b)b.style.display="none"}}catch(e){box.textContent="Live episode schedule unavailable — progress is still saved."}}
function markExact(i,season,episode){let s=shows[i];lastChange={i,progress:s.progress?{...s.progress}:null,note:s.note};s.progress={season,episode};s.note="Season "+season+" • Episode "+episode+" watched";s.status="Watching Now";save();render()}
async function getNextInfo(s){
 if(!s.progress)return null;
 let id=await resolveTvmaze(s);if(!id)return null;
 let r=await fetch("https://api.tvmaze.com/shows/"+id+"/episodes");if(!r.ok)return null;
 let eps=await r.json(),p=s.progress,next=p.complete?eps.find(e=>e.season>p.season&&e.number!=null):eps.find(e=>e.season===p.season&&e.number===p.episode+1);
 if(!next)return {kind:"caught"};
 let when=next.airstamp?new Date(next.airstamp):next.airdate?new Date(next.airdate+"T23:59:59"):null;
 return {kind:when&&when<=new Date()?"available":"scheduled",episode:next,when};
}
async function renderUpdates(){
 let box=document.getElementById("updatesList");if(!box)return;
 let rows=[];
 for(let i=0;i<shows.length;i++){let s=shows[i];if(!s.progress||s.status==="Archive")continue;try{let x=await getNextInfo(s);if(!x||x.kind==="caught")continue;let e=x.episode,d=x.when?x.when.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}):"Date TBA";rows.push({available:x.kind==="available",html:'<div class="update"><strong>'+s.title+'</strong>'+(x.kind==="available"?'<span class="newEp">NEW EPISODE AVAILABLE</span>':'<span class="scheduled">NEXT EPISODE SCHEDULED</span>')+'<div class="statusline">S'+e.season+' E'+e.number+(e.name?" — "+e.name:"")+' • '+d+'</div></div>'})}catch(e){}}
 rows.sort((a,b)=>Number(b.available)-Number(a.available));box.innerHTML=rows.length?rows.map(x=>x.html).join(""):'<p class="empty">No upcoming or newly available episodes found right now.</p>';
}
function card(s,i){let p=s.progress,label=p&&!p.complete?"S"+p.season+" E"+(p.episode+1):"Next Episode",b=s.status==="Watching Now"?'<button id="watch'+i+'" class="watch" onclick="advance('+i+')">✓ Mark '+label+' Watched</button>':"";b+='<button class="edit" onclick="editProgress('+i+')">Edit Progress</button><button class="edit" onclick="changeStatus('+i+')">Change Status</button><button class="edit" onclick="changeCategory('+i+')">Change Category</button>';if(lastChange&&lastChange.i===i)b+='<button class="undo" onclick="undoProgress()">↶ Undo last progress change</button>';if(page==="My Shows")b+='<button class="secondary" onclick="archiveShow('+i+')">Stop Watching</button>';if(page==="Archive")b+='<button class="secondary" onclick="restoreShow('+i+')">Restore</button>';return '<article class="card '+color(s.status)+'"><div class="top"><div><div class="title">'+s.title+'</div><div class="provider">'+s.stream+'</div>'+(s.category&&s.category!=="Regular TV"?'<span class="cat '+(s.category==="Filler TV"?"filler":"trash")+'">'+s.category+'</span>':'')+'</div><span class="badge">'+s.status+'</span></div><div class="detail">'+s.note+'</div>'+(p?'<div class="live" id="live'+i+'">Checking episode schedule…</div>':"")+b+"</article>"}
function render(){
 document.querySelector(".nav").innerHTML=["All","Regular TV","Filler TV","Trash TV"].map(v=>'<button class="'+(page==="Home"&&categoryFilter===v?"on":"")+'" onclick="setCategoryFilter(\''+v+'\')">'+v+'</button>').join("")+'<div class="more"><button class="'+(page!=="Home"?"on":"")+'" onclick="toggleMore()">More ▾</button><div id="moreMenu" class="moremenu"><button onclick="go(\'Updates\')">Updates</button><button onclick="go(\'Discover\')">Discover</button><button onclick="go(\'Archive\')">Archive</button></div></div>';
 let h="";
 if(page==="Home"){["Watching Now","Ready to Start","Waiting","Upcoming"].forEach(g=>{let a=filteredShows().filter(x=>x[0].status===g);if(a.length)h+='<section class="section"><h2>'+g+"</h2>"+a.map(x=>card(x[0],x[1])).join("")+"</section>"})}
 else if(page==="Archive"){let a=shows.map((s,i)=>[s,i]).filter(x=>x[0].status==="Archive");h='<section class="section"><h2>Archive</h2>'+(a.length?a.map(x=>card(x[0],x[1])).join(""):'<p class="empty">No archived shows yet.</p>')+"</section>"}
 else if(page==="Updates")h='<section class="section"><h2>Updates</h2><p class="muted">Live episode changes for shows with saved progress.</p><div id="updatesList"><p class="empty">Checking your shows…</p></div></section>';
 else h='<section class="section"><h2>Discover</h2><p class="empty">Recommendations and related series will appear here.</p></section>';
 document.getElementById("app").innerHTML=h;
 shows.forEach((s,i)=>{if(s.progress&&(s.status==="Watching Now"||s.status==="Waiting"))liveNext(s,i)});
 if(page==="Updates")renderUpdates()
}
save();render();cloudStart();if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}))}
</script></body></html>
