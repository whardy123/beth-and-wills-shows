<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Beth and Will's Shows</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7f9;color:#172033}header{background:#111827;color:#fff;padding:20px 18px 16px;position:sticky;top:0;z-index:3}header h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:#cbd5e1;font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px 14px 88px}.nav{display:flex;gap:7px;overflow:auto;padding:10px 0 16px}.nav button,.add{border:0;border-radius:999px;padding:9px 13px;background:#e5e7eb;white-space:nowrap;font-weight:650}.nav .on{background:#111827;color:#fff}.section{margin:4px 0 22px}.section h2{font-size:18px;margin:0 0 10px}.card{background:white;border-radius:15px;padding:14px;margin:9px 0;box-shadow:0 1px 4px #00000012;border-left:5px solid #94a3b8}.card.green{border-color:#22c55e}.card.blue{border-color:#3b82f6}.card.amber{border-color:#f59e0b}.card.purple{border-color:#8b5cf6}.top{display:flex;justify-content:space-between;gap:10px}.title{font-weight:750;font-size:17px}.provider{font-size:12px;color:#64748b}.provider:before{content:"Stream: ";font-weight:700;color:#475569}.badge{font-size:11px;font-weight:700;border-radius:999px;padding:5px 8px;height:max-content;background:#f1f5f9}.detail{font-size:13px;color:#475569;margin:8px 0}.watch{width:100%;border:0;border-radius:10px;padding:10px;background:#dcfce7;color:#166534;font-weight:750}.empty{color:#64748b;font-size:14px}.secondary{border:0;border-radius:10px;padding:9px;background:#f1f5f9;font-weight:700;margin-top:7px}.undo{border:0;background:none;color:#166534;font-weight:800;margin:7px 0}.edit{border:0;background:none;color:#475569;text-decoration:underline;font-size:12px;margin-top:7px}.live{font-size:12px;color:#475569;margin:7px 0}.newEp{font-weight:800;color:#047857}.scheduled{font-weight:800;color:#7c3aed}.statusline{margin-top:3px}.caught{font-weight:750;color:#7c3aed}.update{background:#fff;border-radius:13px;padding:12px;margin:9px 0;box-shadow:0 1px 4px #00000012}.update strong{display:block;margin-bottom:3px}.muted{color:#64748b;font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:4}.bottom button{border:0;background:none;font-size:11px;color:#475569}.plus{position:fixed;right:18px;bottom:70px;width:52px;height:52px;border-radius:50%;border:0;background:#111827;color:#fff;font-size:27px;box-shadow:0 3px 12px #0003}
</style></head><body>
<header><h1>Beth and Will's Shows</h1><p>Your shows, progress and what's next</p></header>
<main class="wrap"><div class="nav"><button class="on">Home</button><button>My Shows</button><button>Updates</button><button>Discover</button><button>Archive</button></div><div id="app"></div></main>
<button class="plus" onclick="addShow()">+</button>
<nav class="bottom"><button>⌂<br>Home</button><button>▣<br>My Shows</button><button>●<br>Updates</button><button>⌕<br>Discover</button><button>□<br>Archive</button></nav>
<script>
const DATA_VERSION=3, KEY="bwShowsV3";
const seed=[
{title:"Ted Lasso",stream:"Apple TV",status:"Watching Now",note:"Season 4 • Episode 7 watched",progress:{season:4,episode:7},ids:{imdb:"tt10986410"}},
{title:"House of the Dragon",stream:"HBO Max",status:"Watching Now",note:"Season 3 • Episode 1 watched",progress:{season:3,episode:1},ids:{imdb:"tt11198330"}},
{title:"Blood of My Blood",stream:"Starz",status:"Watching Now",note:"Season 2 • Episode 1 watched",progress:{season:2,episode:1},ids:{}},
{title:"Furious",stream:"Hulu",status:"Ready to Start",note:"New show to us",progress:null,ids:{}},
{title:"A Knight of the Seven Kingdoms",stream:"HBO Max",status:"Ready to Start",note:"New show to us",progress:null,ids:{}},
{title:"MobLand",stream:"Paramount+",status:"Ready to Start",note:"New show to us",progress:null,ids:{}},
{title:"Yellowstone",stream:"Peacock",status:"Ready to Start",note:"New show to us",progress:null,ids:{}},
{title:"1883",stream:"Paramount+",status:"Ready to Start",note:"New show to us",progress:null,ids:{}},
{title:"1923",stream:"Paramount+",status:"Ready to Start",note:"New show to us",progress:null,ids:{}},
{title:"Dutton Ranch",stream:"Paramount+",status:"Ready to Start",note:"New show to us",progress:null,ids:{imdb:"tt34991493",tvmaze:84539,tmdb:299167}},
{title:"Marshals",stream:"Paramount+",status:"Ready to Start",note:"New show to us",progress:null,ids:{imdb:"tt36849871",tvmaze:84526,tmdb:290856}},
{title:"Lioness",stream:"Paramount+",status:"Waiting",note:"Watched through Season 3",progress:{season:3,complete:true},ids:{}},
{title:"Yellowjackets",stream:"Paramount+",status:"Waiting",note:"Watched through Season 3",progress:{season:3,complete:true},ids:{}},
{title:"The Testaments",stream:"Hulu",status:"Waiting",note:"Watched Season 1",progress:{season:1,complete:true},ids:{}},
{title:"Paradise",stream:"Hulu",status:"Waiting",note:"Watched through Season 2",progress:{season:2,complete:true},ids:{}},
{title:"The Pitt",stream:"HBO Max",status:"Waiting",note:"Watched through Season 2",progress:{season:2,complete:true},ids:{}},
{title:"Love is Blind",stream:"Netflix",status:"Waiting",note:"Caught up",progress:null,ids:{}},
{title:"Married at First Sight",stream:"Peacock",status:"Waiting",note:"Caught up",progress:null,ids:{}},
{title:"Silo",stream:"Apple TV",status:"Waiting",note:"Watched through Season 3",progress:{season:3,complete:true},ids:{}},
{title:"Love is Blind UK",stream:"Netflix",status:"Upcoming",note:"Latest season to watch",progress:null,ids:{}},
{title:"Power: Legacy",stream:"Checking U.S. availability",status:"Upcoming",note:"Waiting for release",progress:null,ids:{imdb:"tt37509908"}},
{title:"Power: Origins",stream:"Starz",status:"Upcoming",note:"Waiting for release",progress:null,ids:{imdb:"tt31715584"}}
];
localStorage.removeItem("bwShows");localStorage.removeItem("bwShowIds");
let shows;try{shows=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){shows=structuredClone(seed)}
let page="Home",lastChange=null;const tabs=["Home","My Shows","Updates","Discover","Archive"];
function color(s){return s==="Watching Now"?"green":s==="Waiting"?"amber":s==="Upcoming"?"purple":s==="Archive"?"gray":"blue"}
function save(){localStorage.setItem(KEY,JSON.stringify(shows))}
function go(p){page=p;render();scrollTo(0,0)}
async function resolveTvmaze(s){if(s.ids.tvmaze)return s.ids.tvmaze;if(!s.ids.imdb)return null;try{let r=await fetch("https://api.tvmaze.com/lookup/shows?imdb="+encodeURIComponent(s.ids.imdb));if(!r.ok)return null;let sh=await r.json();s.ids.tvmaze=sh.id;s.ids.imdb=(sh.externals&&sh.externals.imdb)||s.ids.imdb;s.ids.thetvdb=sh.externals&&sh.externals.thetvdb;save();return sh.id}catch(e){return null}}
async function autoLink(){for(const s of shows){if(s.ids.tvmaze||s.ids.imdb)continue;try{let r=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(s.title));if(!r.ok)continue;let a=await r.json(),n=v=>(v||"").toLowerCase().replace(/[^a-z0-9]/g,""),x=a.filter(z=>n(z.show.name)===n(s.title));if(x.length===1){let sh=x[0].show;s.ids={tvmaze:sh.id,imdb:sh.externals&&sh.externals.imdb||null,thetvdb:sh.externals&&sh.externals.thetvdb||null};save()}}catch(e){}}render()}
function advance(i){let s=shows[i];lastChange={i,progress:s.progress?{...s.progress}:null,note:s.note};if(!s.progress)s.progress={season:1,episode:1};else if(s.progress.complete){s.progress={season:s.progress.season+1,episode:1}}else s.progress.episode++;s.note="Season "+s.progress.season+" • Episode "+s.progress.episode+" watched";save();render()}
function undoProgress(){if(!lastChange)return;let s=shows[lastChange.i];s.progress=lastChange.progress;s.note=lastChange.note;lastChange=null;save();render()}
function editProgress(i){let s=shows[i],p=s.progress||{};let a=prompt("Season number",p.season||"");if(a===null)return;let b=prompt("Last episode watched",p.episode||"");if(b===null)return;a=parseInt(a);b=parseInt(b);if(!a||isNaN(b)||b<0)return alert("Please enter valid season and episode numbers.");s.progress={season:a,episode:b};s.note="Season "+a+" • Episode "+b+" watched";s.status="Watching Now";save();render()}
function archiveShow(i){shows[i].previousStatus=shows[i].status;shows[i].status="Archive";save();render()}
function restoreShow(i){shows[i].status=shows[i].previousStatus||"Ready to Start";save();render()}
async function addShow(){let t=prompt("Search for a show");if(!t)return;try{let r=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(t)),a=await r.json();if(!a.length)return alert("No matches found.");let list=a.slice(0,5),choices=list.map((x,n)=>(n+1)+". "+x.show.name+" ("+(x.show.premiered?x.show.premiered.slice(0,4):"year unknown")+")").join("\n");let pick=parseInt(prompt("Choose the exact show:\n\n"+choices+"\n\nEnter 1-"+list.length))-1;if(isNaN(pick)||pick<0||pick>=list.length)return;let sh=list[pick].show;if(shows.some(s=>s.ids.tvmaze===sh.id))return alert("That exact show is already in My Shows.");let mode=prompt("How should we add "+sh.name+"?\n\n1. Ready to Start\n2. Watching Now\n3. Already Watched / Caught Up\n\nEnter 1, 2 or 3","1");
if(mode===null)return;
let status="Ready to Start",note="New show to us",progress=null;
if(mode==="2"){
  let sn=parseInt(prompt("Current season","1")),ep=parseInt(prompt("Last episode watched","0"));
  if(!sn||isNaN(ep)||ep<0)return alert("Please enter valid season and episode numbers.");
  status="Watching Now";progress={season:sn,episode:ep};note=ep?"Season "+sn+" • Episode "+ep+" watched":"Starting Season "+sn;
}else if(mode==="3"){
  let sn=parseInt(prompt("Latest season you finished","1"));
  if(!sn)return alert("Please enter a valid season number.");
  status="Waiting";progress={season:sn,complete:true};note="Watched through Season "+sn;
}else if(mode!=="1")return alert("Please choose 1, 2 or 3.");
shows.push({title:sh.name,stream:"Checking U.S. availability",status,note,progress,ids:{tvmaze:sh.id,imdb:sh.externals&&sh.externals.imdb||null,thetvdb:sh.externals&&sh.externals.thetvdb||null}});save();page="My Shows";render();alert(sh.name+" was added to My Shows.")}catch(e){alert("Show search is temporarily unavailable.")}}
async function liveNext(s,i){if(!s.progress)return;let box=document.getElementById("live"+i);if(!box)return;try{let id=await resolveTvmaze(s);if(!id){box.textContent="Exact episode source not linked yet.";return}let r=await fetch("https://api.tvmaze.com/shows/"+id+"/episodes");if(!r.ok)throw 0;let eps=await r.json(),p=s.progress,now=new Date(),next=p.complete?eps.find(e=>e.season>p.season&&e.number!=null):eps.find(e=>e.season===p.season&&e.number===p.episode+1);let b=document.getElementById("watch"+i);if(!next){box.innerHTML='<span class="caught">✓ Caught Up</span><div class="statusline">No next episode is currently listed.</div>';if(b)b.style.display="none";return}let when=next.airstamp?new Date(next.airstamp):next.airdate?new Date(next.airdate+"T23:59:59"):null,released=when&&when<=now,title=next.name?" — "+next.name:"",d=when?when.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}):"date TBA";if(released){box.innerHTML='<span class="newEp">NEW EPISODE AVAILABLE</span><div class="statusline">S'+next.season+" E"+next.number+title+(when?" • "+d:"")+"</div>";if(b){b.style.display="block";b.textContent="✓ Mark S"+next.season+" E"+next.number+" Watched";b.onclick=()=>markExact(i,next.season,next.number)}}else{box.innerHTML='<span class="scheduled">✓ Caught Up</span><div class="statusline">Next: S'+next.season+" E"+next.number+title+" • "+d+"</div>";if(b)b.style.display="none"}}catch(e){box.textContent="Live episode schedule unavailable — progress is still saved."}}
function markExact(i,season,episode){let s=shows[i];lastChange={i,progress:s.progress?{...s.progress}:null,note:s.note};s.progress={season,episode};s.note="Season "+season+" • Episode "+episode+" watched";s.status="Watching Now";save();render()}
async function getNextInfo(s){
 if(!s.progress)return null;
 let id=await resolveTvmaze(s);if(!id)return null;
 let r=await fetch("https://api.tvmaze.com/shows/"+id+"/episodes");if(!r.ok)return null;
 let eps=await r.json(),p=s.progress,next=p.complete?eps.find(e=>e.season>p.season&&e.number!=null):eps.find(e=>e.season===p.season&&e.number===p.episode+1);
 if(!next)return {kind:"caught"};
 let when=next.airstamp?new Date(next.airstamp):next.airdate?new Date(next.airdate+"T23:59:59"):null;
 return {kind:when&&when<=new Date()?"available":"scheduled",episode:next,when};
}
async function renderUpdates(){
 let box=document.getElementById("updatesList");if(!box)return;
 let rows=[];
 for(let i=0;i<shows.length;i++){let s=shows[i];if(!s.progress||s.status==="Archive")continue;try{let x=await getNextInfo(s);if(!x||x.kind==="caught")continue;let e=x.episode,d=x.when?x.when.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}):"Date TBA";rows.push({available:x.kind==="available",html:'<div class="update"><strong>'+s.title+'</strong>'+(x.kind==="available"?'<span class="newEp">NEW EPISODE AVAILABLE</span>':'<span class="scheduled">NEXT EPISODE SCHEDULED</span>')+'<div class="statusline">S'+e.season+' E'+e.number+(e.name?" — "+e.name:"")+' • '+d+'</div></div>'})}catch(e){}}
 rows.sort((a,b)=>Number(b.available)-Number(a.available));box.innerHTML=rows.length?rows.map(x=>x.html).join(""):'<p class="empty">No upcoming or newly available episodes found right now.</p>';
}
function card(s,i){let p=s.progress,label=p&&!p.complete?"S"+p.season+" E"+(p.episode+1):"Next Episode",b=s.status==="Watching Now"?'<button id="watch'+i+'" class="watch" onclick="advance('+i+')">✓ Mark '+label+' Watched</button>':"";b+='<button class="edit" onclick="editProgress('+i+')">Edit Progress</button>';if(lastChange&&lastChange.i===i)b+='<button class="undo" onclick="undoProgress()">↶ Undo last progress change</button>';if(page==="My Shows")b+='<button class="secondary" onclick="archiveShow('+i+')">Stop Watching</button>';if(page==="Archive")b+='<button class="secondary" onclick="restoreShow('+i+')">Restore</button>';return '<article class="card '+color(s.status)+'"><div class="top"><div><div class="title">'+s.title+'</div><div class="provider">'+s.stream+'</div></div><span class="badge">'+s.status+'</span></div><div class="detail">'+s.note+'</div>'+(p?'<div class="live" id="live'+i+'">Checking episode schedule…</div>':"")+b+"</article>"}
function render(){document.querySelector(".nav").innerHTML=tabs.map(x=>'<button class="'+(page===x?"on":"")+'" onclick="go(\''+x+'\')">'+x+"</button>").join("");document.querySelector(".bottom").innerHTML=tabs.map((x,i)=>'<button onclick="go(\''+x+'\')">'+["⌂","▣","●","⌕","□"][i]+"<br>"+x+"</button>").join("");let h="";if(page==="Home"){["Watching Now","Ready to Start","Waiting","Upcoming"].forEach(g=>{let a=shows.map((s,i)=>[s,i]).filter(x=>x[0].status===g);if(a.length)h+='<section class="section"><h2>'+g+"</h2>"+a.map(x=>card(x[0],x[1])).join("")+"</section>"})}else if(page==="My Shows")h='<section class="section"><h2>My Shows</h2>'+shows.map((s,i)=>[s,i]).filter(x=>x[0].status!=="Archive").map(x=>card(x[0],x[1])).join("")+"</section>";else if(page==="Archive"){let a=shows.map((s,i)=>[s,i]).filter(x=>x[0].status==="Archive");h='<section class="section"><h2>Archive</h2>'+(a.length?a.map(x=>card(x[0],x[1])).join(""):'<p class="empty">No archived shows yet.</p>')+"</section>"}else if(page==="Updates")h='<section class="section"><h2>Updates</h2><p class="muted">Live episode changes for shows with saved progress.</p><div id="updatesList"><p class="empty">Checking your shows…</p></div></section>';else h='<section class="section"><h2>Discover</h2><p class="empty">Recommendations and related series will appear here.</p></section>';document.getElementById("app").innerHTML=h;shows.forEach((s,i)=>{if(s.progress&&(s.status==="Watching Now"||s.status==="Waiting"))liveNext(s,i)});if(page==="Updates")renderUpdates()}
save();render();autoLink();
</script></body></html>
