<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Beth and Will's Shows</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7f9;color:#172033}header{background:#111827;color:#fff;padding:20px 18px 16px;position:sticky;top:0;z-index:3}header h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:#cbd5e1;font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px 14px 88px}.nav{display:flex;gap:7px;overflow:auto;padding:10px 0 16px}.nav button,.add{border:0;border-radius:999px;padding:9px 13px;background:#e5e7eb;white-space:nowrap;font-weight:650}.nav .on{background:#111827;color:#fff}.section{margin:4px 0 22px}.section h2{font-size:18px;margin:0 0 10px}.card{background:white;border-radius:15px;padding:14px;margin:9px 0;box-shadow:0 1px 4px #00000012;border-left:5px solid #94a3b8}.card.green{border-color:#22c55e}.card.blue{border-color:#3b82f6}.card.amber{border-color:#f59e0b}.card.purple{border-color:#8b5cf6}.top{display:flex;justify-content:space-between;gap:10px}.title{font-weight:750;font-size:17px}.provider{font-size:12px;color:#64748b}.provider:before{content:"Stream: ";font-weight:700;color:#475569}.badge{font-size:11px;font-weight:700;border-radius:999px;padding:5px 8px;height:max-content;background:#f1f5f9}.detail{font-size:13px;color:#475569;margin:8px 0}.watch{width:100%;border:0;border-radius:10px;padding:10px;background:#dcfce7;color:#166534;font-weight:750}.empty{color:#64748b;font-size:14px}.secondary{border:0;border-radius:10px;padding:9px;background:#f1f5f9;font-weight:700;margin-top:7px}.undo{border:0;background:none;color:#166534;font-weight:800;margin:7px 0}.edit{border:0;background:none;color:#475569;text-decoration:underline;font-size:12px;margin-top:7px}.live{font-size:12px;color:#475569;margin:7px 0}.newEp{font-weight:800;color:#047857}.caught{font-weight:750;color:#7c3aed}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:4}.bottom button{border:0;background:none;font-size:11px;color:#475569}.plus{position:fixed;right:18px;bottom:70px;width:52px;height:52px;border-radius:50%;border:0;background:#111827;color:#fff;font-size:27px;box-shadow:0 3px 12px #0003}
</style></head><body>
<header><h1>Beth and Will's Shows</h1><p>Your shows, progress and what's next</p></header>
<main class="wrap"><div class="nav"><button class="on">Home</button><button>My Shows</button><button>Updates</button><button>Discover</button><button>Archive</button></div><div id="app"></div></main>
<button class="plus" onclick="addShow()">+</button>
<nav class="bottom"><button>⌂<br>Home</button><button>▣<br>My Shows</button><button>●<br>Updates</button><button>⌕<br>Discover</button><button>□<br>Archive</button></nav>
<script>
const seed=[
["Ted Lasso","Apple","Watching Now","Caught up — waiting for next episode","green"],
["House of the Dragon","HBO Max","Watching Now","Season 3 • Episode 1 watched","green",3,1],
["Blood of My Blood","Starz","Watching Now","Season 2 • Episode 1 watched","green",2,1],
["Furious","Hulu","Ready to Start","New show to us","blue"],["A Knight of the Seven Kingdoms","HBO Max","Ready to Start","New show to us","blue"],["MobLand","Paramount+","Ready to Start","New show to us","blue"],["Yellowstone","Paramount+","Ready to Start","New show to us","blue"],["1883","Paramount+","Ready to Start","New show to us","blue"],["1923","Paramount+","Ready to Start","New show to us","blue"],["Dutton Ranch","Paramount+","Ready to Start","New show to us","blue"],["Marshals","Paramount+","Ready to Start","New show to us","blue"],
["Lioness","Paramount+","Waiting","Watched through Season 3","amber"],["Yellowjackets","","Waiting","Watched through Season 3","amber"],["The Testaments","Hulu","Waiting","Watched Season 1","amber"],["Paradise","Hulu","Waiting","Watched through Season 2","amber"],["The Pitt","HBO Max","Waiting","Watched through Season 2","amber"],["Love is Blind","Netflix","Waiting","Caught up","amber"],["Married at First Sight","Peacock","Waiting","Caught up","amber"],["Silo","Apple","Waiting","Watched through Season 3","amber"],
["Love is Blind UK","Netflix","Upcoming","Latest season to watch","purple"],["Power: Legacy","Starz","Upcoming","Waiting for release","purple"],["Power: Origins","Starz","Upcoming","Waiting for release","purple"]];
const ids={
"Ted Lasso":{imdb:"tt10986410"},
"House of the Dragon":{imdb:"tt11198330"},
"Power: Legacy":{imdb:"tt37509908"},
"Power: Origins":{imdb:"tt31715584"},
"Dutton Ranch":{imdb:"tt34991493",tvmaze:84539,tmdb:299167},
"Marshals":{imdb:"tt36849871",tvmaze:84526,tmdb:290856}
};
let shows;try{shows=JSON.parse(localStorage.getItem("bwShows"))||seed}catch(e){shows=seed}
// Migrate provider values saved before provider meant current streaming availability.
shows.forEach(s=>{if(s[0]==="The West Wing"&&s[1]==="NBC")s[1]="Checking U.S. availability"});
const verifiedStreaming={
"The West Wing":"Netflix • HBO Max",
"Yellowjackets":"Paramount+",
"Furious":"Hulu",
"A Knight of the Seven Kingdoms":"HBO Max",
"MobLand":"Paramount+",
"1883":"Paramount+",
"1923":"Paramount+",
"Paradise":"Hulu",
"Silo":"Apple TV",
"Love is Blind":"Netflix",
"Married at First Sight":"Peacock",
"Lioness":"Paramount+",
"The Testaments":"Hulu",
"Love is Blind UK":"Netflix",
"Ted Lasso":"Apple TV",
"Yellowstone":"Peacock",
"Blood of My Blood":"Starz",
"The Pitt":"HBO Max"
};
shows.forEach(s=>{if(verifiedStreaming[s[0]])s[1]=verifiedStreaming[s[0]]});
save();
function getIds(s){return ids[s[0]]||{}}
async function resolveTvmaze(s){let x=getIds(s);if(x.tvmaze)return x.tvmaze;if(!x.imdb)return null;try{let r=await fetch("https://api.tvmaze.com/lookup/shows?imdb="+encodeURIComponent(x.imdb));if(!r.ok)return null;let sh=await r.json();if(sh&&sh.id){x.tvmaze=sh.id;return sh.id}}catch(e){}return null}
let page="Home";let lastChange=null;const tabs=["Home","My Shows","Updates","Discover","Archive"];
function save(){try{localStorage.setItem("bwShows",JSON.stringify(shows))}catch(e){}}
function go(p){page=p;render();scrollTo(0,0)}
function advance(i){let s=shows[i];lastChange={i:i,oldNote:s[3],oldSeason:s[5],oldEpisode:s[6]};if(s[5]){s[6]=(s[6]||0)+1;s[3]="Season "+s[5]+" • Episode "+s[6]+" watched"}else{s[3]="Progress saved — caught up"}save();render()}
function undoProgress(){if(!lastChange)return;let s=shows[lastChange.i];s[3]=lastChange.oldNote;s[5]=lastChange.oldSeason;s[6]=lastChange.oldEpisode;lastChange=null;save();render()}
function editProgress(i){let s=shows[i];let season=prompt("Season number",s[5]||"");if(season===null)return;let episode=prompt("Last episode watched",s[6]||"");if(episode===null)return;season=parseInt(season);episode=parseInt(episode);if(!season||episode<0||isNaN(episode))return alert("Please enter valid season and episode numbers.");s[5]=season;s[6]=episode;s[3]="Season "+season+" • Episode "+episode+" watched";lastChange=null;save();render()}
function archiveShow(i){shows[i][7]=shows[i][2];shows[i][2]="Archive";shows[i][4]="gray";save();render()}
function restoreShow(i){shows[i][2]=shows[i][7]||"Ready to Start";shows[i][4]=shows[i][2]==="Watching Now"?"green":shows[i][2]==="Waiting"?"amber":shows[i][2]==="Upcoming"?"purple":"blue";save();render()}
async function addShow(){let t=prompt("Search for a show");if(!t)return;try{let r=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(t));let results=await r.json();if(!results.length)return alert("No matches found.");let choices=results.slice(0,5).map((x,n)=>(n+1)+". "+x.show.name+" ("+(x.show.premiered?x.show.premiered.slice(0,4):"year unknown")+")"+(x.show.webChannel?" — "+x.show.webChannel.name:x.show.network?" — "+x.show.network.name:"")).join("\n");let pick=prompt("Choose the exact show:\n\n"+choices+"\n\nEnter 1-"+Math.min(5,results.length));let n=parseInt(pick)-1;if(isNaN(n)||n<0||n>=Math.min(5,results.length))return;let sh=results[n].show;if(shows.some(s=>s[0]===sh.name&&getIds(s).tvmaze===sh.id))return alert("That exact show is already in My Shows.");let p="Checking U.S. availability";let row=[sh.name,p,"Ready to Start","Added from verified search","blue"];shows.push(row);ids[sh.name]={tvmaze:sh.id,imdb:sh.externals&&sh.externals.imdb||null,thetvdb:sh.externals&&sh.externals.thetvdb||null};save();page="My Shows";render();alert(sh.name+" was added to My Shows.");}catch(e){alert("Show search is temporarily unavailable. Please try again.")}}
function esc(x){return encodeURIComponent(x)}
async function liveNext(s,i){if(!s[5])return;let box=document.getElementById("live"+i);if(!box)return;try{let mazeId=await resolveTvmaze(s);if(!mazeId){box.textContent="Exact episode source not linked yet.";return}let q=await fetch("https://api.tvmaze.com/shows/"+mazeId+"/episodes");if(!q.ok)throw 0;let eps=await q.json();let next=eps.find(e=>e.season===s[5]&&e.number===(s[6]||0)+1);if(!next){box.innerHTML='<span class="caught">✓ Caught Up</span>';return}let when=next.airstamp?new Date(next.airstamp):next.airdate?new Date(next.airdate+"T23:59:59"):null;let released=when&&when.getTime()<=Date.now();let title=next.name?" — "+next.name:"";if(released){box.innerHTML='<span class="newEp">NEW EPISODE AVAILABLE</span><br>S'+next.season+' E'+next.number+title;let btn=document.getElementById("watch"+i);if(btn){btn.disabled=false;btn.style.display="block"}}else{let d=when?when.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}):"date TBA";box.innerHTML='<span class="caught">✓ Caught Up</span><br>Next: S'+next.season+' E'+next.number+title+' • '+d;let btn=document.getElementById("watch"+i);if(btn)btn.style.display="none"}}catch(e){box.textContent="Live episode schedule unavailable — progress is still saved.";}}
function card(s,i){let b=s[2]==="Watching Now"?'<button id="watch'+i+'" class="watch" onclick="advance('+i+')">✓ Mark '+(s[5]?'S'+s[5]+' E'+((s[6]||0)+1):'Next Episode')+' Watched</button>':'';b+='<button class="edit" onclick="editProgress('+i+')">Edit Progress</button>';if(lastChange&&lastChange.i===i)b+='<button class="undo" onclick="undoProgress()">↶ Undo last progress change</button>';if(page==="My Shows")b+='<button class="secondary" onclick="archiveShow('+i+')">Stop Watching</button>';if(page==="Archive")b+='<button class="secondary" onclick="restoreShow('+i+')">Restore</button>';return '<article class="card '+s[4]+'"><div class="top"><div><div class="title">'+s[0]+'</div><div class="provider">'+(s[1]||'Checking U.S. availability')+'</div></div><span class="badge">'+s[2]+'</span></div><div class="detail">'+s[3]+'</div>'+(s[5]?'<div class="live" id="live'+i+'">Checking episode schedule…</div>':'')+b+'</article>'}
function render(){document.querySelector(".nav").innerHTML=tabs.map(x=>'<button class="'+(page===x?'on':'')+'" onclick="go(\''+x+'\')">'+x+'</button>').join("");document.querySelector(".bottom").innerHTML=tabs.map((x,i)=>'<button onclick="go(\''+x+'\')">'+["⌂","▣","●","⌕","□"][i]+'<br>'+x+'</button>').join("");let h="";if(page==="Home"){["Watching Now","Ready to Start","Waiting","Upcoming"].forEach(g=>{let a=shows.map((s,i)=>[s,i]).filter(x=>x[0][2]===g);if(a.length)h+='<section class="section"><h2>'+g+'</h2>'+a.map(x=>card(x[0],x[1])).join("")+'</section>'})}else if(page==="My Shows"){h='<section class="section"><h2>My Shows</h2>'+shows.map((s,i)=>[s,i]).filter(x=>x[0][2]!=="Archive").map(x=>card(x[0],x[1])).join("")+'</section>'}else if(page==="Archive"){let a=shows.map((s,i)=>[s,i]).filter(x=>x[0][2]==="Archive");h='<section class="section"><h2>Archive</h2>'+(a.length?a.map(x=>card(x[0],x[1])).join(""):'<p class="empty">No archived shows yet.</p>')+'</section>'}else if(page==="Updates"){h='<section class="section"><h2>Updates</h2><p class="empty">Renewals, new episodes and premiere-date changes will appear here when live data is connected.</p></section>'}else{h='<section class="section"><h2>Discover</h2><p class="empty">Recommendations and related series will appear here.</p></section>'}document.getElementById("app").innerHTML=h;shows.forEach((s,i)=>{if(s[2]==="Watching Now"&&s[5])liveNext(s,i)})}
render();
</script></body></html>
